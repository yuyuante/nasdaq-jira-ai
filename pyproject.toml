[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nasdaq-jira-ai"
version = "0.1.0"
description = "Configurable Playwright crawler for Nasdaq Jira issues."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "playwright>=1.49,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6.0,<7",
  "types-PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "black>=24.10,<26",
  "mypy>=1.13,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
nasdaq-jira = "nasdaq_jira.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nasdaq_jira"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
disallow_any_generics = true
exclude = "tests"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]


