rag:
  enabled: true
  embedding_provider: openai
  embedding_model: text-embedding-3-small
  answer_model: gpt-4o-mini
  api_key: null
  base_url: https://api.openai.com/v1
  top_k: 8
  score_threshold: 0.75
  chunk_size: 800
  chunk_overlap: 100
sync:
  mode: incremental
  overlap_hours: 6
  batch_size: 50
  datasource: default
datasource:
  mode: auto
  api:
    base_url: https://jira.example.com
    token: null
    timeout_ms: 30000
    page_size: 50
    retry_attempts: 3
    retry_initial_delay: 1.0
browser:
  headless: true
  timeout_ms: 30000
  storage_state_path: storage_state.json
  authenticated_selector: "a[href*='Logout'], a[href*='logout']"
  login_selector: "form#login-form, input[name='username']"
crawler:
  search_url: "https://jira.example.com/issues/?jql=project%20%3D%20NASDAQ"
  max_pages: 100
  page_size: 50
  detail_concurrency: 4
  detail_activity_timeout_ms: 10000
  selectors:
    issue: "a[href*='/jira/browse/'][href*='-'], tr[data-testid='issue-row'], tr.issuerow"
    key: "a[href*='/jira/browse/'][href*='-'], a[data-issue-key], a[data-testid='issue-key'], a.issue-link"
    summary: "a[href*='/jira/browse/'][href*='-'], a[data-issue-key], [data-testid='issue-summary'], td.summary"
    status: "[data-testid='issue-status'], td.status"
    updated_at: "[data-testid='issue-updated'], td.updated"
    next_page: "a[href*='startIndex='], a[aria-label='Next page'], a[title='Next'], a.next"
    detail_summary: "#summary-val h2"
    detail_status: "#opsbar-transitions_more .dropdown-text"
    detail_priority: "#priority-val"
    detail_description: "#description-val .user-content-block"
    detail_assignee: "#assignee-val"
    detail_reporter: "#reporter-val"
    detail_issue_type: "#type-val"
    detail_resolution: "#resolution-val"
    detail_affects_versions: "#versions-val .version-link"
    detail_service_product: ""
    detail_created_at: "#created-val"
    detail_labels: "#labels-wrap .lozenge"
    detail_components: "#components-val .component-link"
    detail_fix_versions: "#fixfor-val .version-link"
    detail_comments: "#issuecommentcontainer .action-body, .action-body"
    detail_history: "#changehistory .changehistory"
    detail_attachments: "#attachmentmodule .attachment-title"
    priority: ""
    description: ""
    assignee: ""
    reporter: ""
    labels: ""
    components: ""
    fix_versions: ""
    comment: ""
    attachment: ""
    history: ""
database:
  path: data/nasdaq_jira.sqlite3
logging:
  level: INFO
  file: logs/nasdaq-jira.log
  backup_count: 14

