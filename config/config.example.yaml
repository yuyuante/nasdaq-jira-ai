rag:
  enabled: true
  embedding_provider: openai
  embedding_model: text-embedding-3-small
  answer_model: gpt-4o-mini
  api_key: null
  base_url: https://api.openai.com/v1
  top_k: 8
  score_threshold: 0.75
  chunk_size: 800
  chunk_overlap: 100
sync:
  mode: incremental
  overlap_hours: 6
  batch_size: 50
  datasource: default
datasource:
  mode: auto
  api:
    base_url: https://jira.example.com
    token: null
    timeout_ms: 30000
    page_size: 50
    retry_attempts: 3
    retry_initial_delay: 1.0
browser:
  headless: true
  timeout_ms: 30000
  storage_state_path: storage_state.json
  authenticated_selector: "a[href*='Logout'], a[href*='logout']"
  login_selector: "form#login-form, input[name='username']"
crawler:
  search_url: "https://jira.example.com/issues/?jql=project%20%3D%20NASDAQ"
  max_pages: 10
  page_size: 50
  selectors:
    issue: "tr[data-testid='issue-row'], tr.issuerow"
    key: "a[data-testid='issue-key'], a.issue-link"
    summary: "[data-testid='issue-summary'], td.summary"
    status: "[data-testid='issue-status'], td.status"
    updated_at: "[data-testid='issue-updated'], td.updated"
    next_page: "a[aria-label='Next page'], a.next"
    priority: ""
    description: ""
    assignee: ""
    reporter: ""
    labels: ""
    components: ""
    fix_versions: ""
    comment: ""
    attachment: ""
    history: ""
database:
  path: data/nasdaq_jira.sqlite3
logging:
  level: INFO
  file: logs/nasdaq-jira.log
  backup_count: 14

