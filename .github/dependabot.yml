version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
        patterns:
          - black
          - mypy
          - pre-commit
          - pytest
          - pytest-asyncio
          - ruff
          - types-PyYAML